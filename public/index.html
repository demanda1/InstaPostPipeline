<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>InstaPost Pipeline</title>
  <style>
    :root {
      --bg: #0f1115;
      --panel: #181b22;
      --border: #2a2f3a;
      --text: #e7e9ee;
      --muted: #9aa3b2;
      --accent: #6366f1;
      --accent-hover: #4f52d6;
      --danger: #ef4444;
      --danger-hover: #dc2626;
      --success: #10b981;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 32px;
      width: 100%;
      max-width: 560px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
    }
    h1 { margin: 0 0 4px; font-size: 22px; }
    .subtitle { color: var(--muted); margin: 0 0 24px; font-size: 14px; }
    label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
    input[type="text"] {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
    }
    input[type="text"]:focus { border-color: var(--accent); }
    button {
      border: none;
      border-radius: 8px;
      padding: 10px 16px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-primary { background: var(--accent); color: white; }
    .btn-primary:hover:not(:disabled) { background: var(--accent-hover); }
    .btn-secondary { background: #2a2f3a; color: var(--text); }
    .btn-secondary:hover:not(:disabled) { background: #353b48; }
    .btn-danger { background: var(--danger); color: white; }
    .btn-danger:hover:not(:disabled) { background: var(--danger-hover); }
    .row { display: flex; gap: 8px; margin-top: 16px; }
    .row > * { flex: 1; }
    .status {
      margin-top: 20px;
      padding: 12px;
      border-radius: 8px;
      font-size: 13px;
      background: var(--bg);
      border: 1px solid var(--border);
      min-height: 44px;
      white-space: pre-wrap;
      word-break: break-all;
      font-family: ui-monospace, "SF Mono", monospace;
    }
    .status.error { border-color: var(--danger); color: var(--danger); }
    .status.success { border-color: var(--success); }
    .actions { margin-top: 16px; display: none; gap: 8px; }
    .actions.visible { display: flex; }
    .key-display {
      font-family: ui-monospace, monospace;
      font-size: 12px;
      color: var(--muted);
      margin-top: 8px;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>InstaPost Pipeline</h1>
    <p class="subtitle">Generate a 4-slide Instagram carousel from a topic.</p>

    <label for="topic">Topic</label>
    <input type="text" id="topic" placeholder="e.g. AI for makers" />

    <div class="row">
      <button id="generate" class="btn-primary">Generate</button>
    </div>

    <div class="status" id="status">Ready.</div>
    <div class="key-display" id="keyDisplay"></div>

    <div class="actions" id="actions">
      <button id="download" class="btn-secondary">Download ZIP</button>
      <button id="delete" class="btn-danger">Delete from R2</button>
    </div>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);
    const topicInput = $("topic");
    const generateBtn = $("generate");
    const downloadBtn = $("download");
    const deleteBtn = $("delete");
    const statusEl = $("status");
    const keyDisplay = $("keyDisplay");
    const actions = $("actions");

    let currentKey = null;

    function setStatus(msg, kind) {
      statusEl.textContent = msg;
      statusEl.className = "status" + (kind ? " " + kind : "");
    }

    function setBusy(busy) {
      generateBtn.disabled = busy;
      downloadBtn.disabled = busy;
      deleteBtn.disabled = busy;
    }

    function showActions(key) {
      currentKey = key;
      keyDisplay.textContent = "key: " + key;
      actions.classList.add("visible");
    }

    function hideActions() {
      currentKey = null;
      keyDisplay.textContent = "";
      actions.classList.remove("visible");
    }

    generateBtn.addEventListener("click", async () => {
      const topic = topicInput.value.trim();
      if (!topic) {
        setStatus("Enter a topic first.", "error");
        return;
      }
      setBusy(true);
      hideActions();
      setStatus("Generating slides… this can take ~30-60s.");
      try {
        const res = await fetch("/generate-posts", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ topic }),
        });
        if (!res.ok) {
          const text = await res.text();
          throw new Error(`HTTP ${res.status}: ${text}`);
        }
        const data = await res.json();
        setStatus(
          `Done. ${data.file_count} files, ${(data.size_bytes / 1024).toFixed(1)} KB.`,
          "success"
        );
        showActions(data.key);
      } catch (err) {
        setStatus("Generation failed: " + err.message, "error");
      } finally {
        setBusy(false);
      }
    });

    downloadBtn.addEventListener("click", async () => {
      if (!currentKey) return;
      setBusy(true);
      setStatus("Downloading…");
      try {
        const res = await fetch(`/download/${encodeURIComponent(currentKey)}`);
        if (!res.ok) {
          const text = await res.text();
          throw new Error(`HTTP ${res.status}: ${text}`);
        }
        const blob = await res.blob();
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = currentKey;
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
        setStatus("Downloaded " + currentKey, "success");
      } catch (err) {
        setStatus("Download failed: " + err.message, "error");
      } finally {
        setBusy(false);
      }
    });

    deleteBtn.addEventListener("click", async () => {
      if (!currentKey) return;
      setBusy(true);
      setStatus("Deleting from R2…");
      const keyToDelete = currentKey;
      try {
        const res = await fetch(`/download/${encodeURIComponent(keyToDelete)}`, {
          method: "DELETE",
        });
        if (!res.ok) {
          const text = await res.text();
          throw new Error(`HTTP ${res.status}: ${text}`);
        }
        setStatus("Deleted " + keyToDelete, "success");
        hideActions();
      } catch (err) {
        setStatus("Delete failed: " + err.message, "error");
      } finally {
        setBusy(false);
      }
    });
  </script>
</body>
</html>
